<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>MINER TYCOON: SUPREME</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="exp-container">
        <div id="exp-bar"></div>
    </div>
    
    <div id="game-container">
        <div class="top-bar">
            <div class="stat">💰 <span id="money">0</span></div>
            <div class="stat">⚡ <span id="gps">0</span>/с</div>
            <div class="stat">⭐ Ур. <span id="lvl-text">1</span></div>
        </div>

        <div id="screen-mine" class="screen">
            <div class="mine-area">
                <div id="ore" onclick="handleMine(event)">💎</div>
            </div>
            <div class="bottom-controls">
                <button class="nav-btn" onclick="changeScreen('shop')">МАГАЗИН 🛒</button>
            </div>
        </div>

        <div id="screen-shop" class="screen hidden">
            <div class="shop-header">
                <h2>УЛУЧШЕНИЯ</h2>
                <button class="close-btn" onclick="changeScreen('mine')">❌</button>
            </div>
            <div id="shop-list">
                </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="storage.js"></script>
    <script src="script.js"></script>
</body>
</html>
