<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>MINER TYCOON: ULTIMATE</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="exp-container">
        <div id="exp-bar"></div>
    </div>

    <div id="event-layer" style="position: fixed; width: 100%; height: 100%; pointer-events: none; z-index: 2500;"></div>

    <div id="frenzy-container" class="hidden" onclick="startFrenzy()">
        🔥 ЛИХОРАДКА! 🔥
    </div>
    
    <div id="game-container">
        <div class="top-bar">
            <div class="stat">💰 <span id="money">0</span></div>
            <div class="stat">⚡ <span id="gps">0</span>/с</div>
            <div class="stat">⭐ Ур. <span id="lvl-text">1</span></div>
        </div>

        <div id="screen-mine" class="screen">
            <div class="mine-area">
                <div id="ore" onclick="handleMine(event)">💎</div>
            </div>
            <div id="pet-slot" style="position: absolute; bottom: 100px; left: 20px; font-size: 40px; filter: drop-shadow(0 0 5px gold);"></div>
        </div>

        <div id="screen-shop" class="screen hidden">
            <div class="header-area">
                <h2>МАГАЗИН</h2>
            </div>
            <div id="shop-list" class="scrollable"></div>
        </div>

        <div id="screen-achievements" class="screen hidden">
            <div class="header-area">
                <h2>ДОСТИЖЕНИЯ</h2>
            </div>
            <div id="achievements-list" class="scrollable"></div>
        </div>

        <div id="screen-wheel" class="screen hidden">
            <div class="header-area">
                <h2>КОЛЕСО ФОРТУНЫ</h2>
            </div>
            <div class="wheel-box">
                <div id="wheel-visual">🎁</div>
                <button id="spin-btn" class="nav-btn" onclick="spinWheel()">КРУТИТЬ</button>
                <p id="wheel-timer">Доступно!</p>
            </div>
        </div>

        <div id="screen-prestige" class="screen hidden">
            <div class="header-area">
                <h2>ПРЕСТИЖ</h2>
            </div>
            <div class="scrollable" style="text-align: center;">
                <div style="background: #1a1a1a; padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #4b0082;">
                    <p>Кристаллы Тьмы: <span id="crystals-count" style="color: #bc13fe; font-weight: bold;">0</span> 🔮</p>
                    <p>Бонус дохода: <span id="prestige-bonus">0</span>%</p>
                    <button class="nav-btn" onclick="doPrestige()" style="background: #4b0082; color: white;">ПЕРЕРОЖДЕНИЕ</button>
                    <p style="font-size: 0.8rem; color: #888; margin-top: 10px;">Доступно с 100 уровня. Сбросит всё, кроме кристаллов и навыков.</p>
                </div>

                <h3>ДЕРЕВО НАВЫКОВ</h3>
                <div id="skills-list">
                    </div>
            </div>
        </div>

        <nav class="bottom-menu">
            <button onclick="changeScreen('mine')" title="Добыча">⛏️</button>
            <button onclick="changeScreen('shop')" title="Магазин">🛒</button>
            <button onclick="changeScreen('achievements')" title="Достижения">🏆</button>
            <button onclick="changeScreen('wheel')" title="Удача">🎡</button>
            <button onclick="changeScreen('prestige')" title="Развитие">🔮</button>
        </nav>
    </div>

    <script src="data.js"></script>
    <script src="storage.js"></script>
    <script src="script.js"></script>
</body>
</html>
