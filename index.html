<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Idle Miner Tycoon Clone</title>
    <style>
        body { 
            margin: 0; background: #2c3e50; color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }
        #header { background: #1a252f; padding: 20px; text-align: center; border-bottom: 4px solid #f1c40f; }
        #money { font-size: 32px; color: #f1c40f; font-weight: bold; }
        
        #game-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        #rock { 
            width: 200px; height: 200px; background: #7f8c8d; border-radius: 20%; 
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; border: 8px solid #95a5a6; transition: transform 0.1s;
            user-select: none; box-shadow: 0 10px 0 #34495e;
        }
        #rock:active { transform: scale(0.95) translateY(5px); box-shadow: 0 5px 0 #34495e; }
        #rock-text { font-size: 40px; }

        #shop { 
            background: #34495e; padding: 15px; display: grid; 
            grid-template-columns: 1fr 1fr; gap: 10px; border-top: 2px solid #2c3e50;
        }
        .upgrade-btn {
            background: #27ae60; border: none; padding: 15px; color: white;
            border-radius: 10px; cursor: pointer; display: flex; flex-direction: column;
            align-items: center; transition: 0.2s;
        }
        .upgrade-btn:disabled { background: #7f8c8d; cursor: not-allowed; opacity: 0.5; }
        .upgrade-btn .cost { font-size: 12px; color: #f1c40f; }
        
        /* Анимация вылетающих чисел */
        .particle { position: absolute; color: #f1c40f; font-weight: bold; pointer-events: none; animation: floatUp 1s forwards; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-100px); } }
    </style>
</head>
<body>

<div id="header">
    <div>Твоё Золото:</div>
    <div id="money">0</div>
    <div id="gps">Доход в сек: 0</div>
</div>

<div id="game-area">
    <div id="rock" onclick="mine()">
        <span id="rock-text">⛏️</span>
    </div>
</div>

<div id="shop">
    <button class="upgrade-btn" id="upg-click" onclick="buyUpgrade('click')">
        <span>Улучшить кирку</span>
        <span class="cost" id="cost-click">Цена: 10</span>
    </button>
    <button class="upgrade-btn" id="upg-miner" onclick="buyUpgrade('miner')">
        <span>Нанять шахтера</span>
        <span class="cost" id="cost-miner">Цена: 50</span>
    </button>
    <button class="upgrade-btn" id="upg-drill" onclick="buyUpgrade('drill')">
        <span>Буровая установка</span>
        <span class="cost" id="cost-drill">Цена: 500</span>
    </button>
    <button class="upgrade-btn" onclick="resetGame()" style="background: #c0392b;">
        <span>Сброс</span>
    </button>
</div>

<script>
    let state = {
        money: 0,
        clickPower: 1,
        gps: 0,
        costs: { click: 10, miner: 50, drill: 500 },
        amounts: { miner: 0, drill: 0 }
    };

    // Загрузка сохранения
    const saved = localStorage.getItem('idleMinerSave');
    if (saved) state = JSON.parse(saved);

    function updateUI() {
        document.getElementById('money').innerText = Math.floor(state.money).toLocaleString();
        document.getElementById('gps').innerText = `Доход в сек: ${state.gps.toFixed(1)}`;
        document.getElementById('cost-click').innerText = `Цена: ${state.costs.click}`;
        document.getElementById('cost-miner').innerText = `Цена: ${state.costs.miner}`;
        document.getElementById('cost-drill').innerText = `Цена: ${state.costs.drill}`;
        
        // Проверка доступности кнопок
        document.getElementById('upg-click').disabled = state.money < state.costs.click;
        document.getElementById('upg-miner').disabled = state.money < state.costs.miner;
        document.getElementById('upg-drill').disabled = state.money < state.costs.drill;
    }

    function mine() {
        state.money += state.clickPower;
        createParticle(`+${state.clickPower}`);
        updateUI();
        save();
    }

    function buyUpgrade(type) {
        if (state.money >= state.costs[type]) {
            state.money -= state.costs[type];
            
            if (type === 'click') {
                state.clickPower += 1;
                state.costs.click = Math.floor(state.costs.click * 1.5);
            } else if (type === 'miner') {
                state.gps += 1;
                state.amounts.miner++;
                state.costs.miner = Math.floor(state.costs.miner * 1.3);
            } else if (type === 'drill') {
                state.gps += 10;
                state.amounts.drill++;
                state.costs.drill = Math.floor(state.costs.drill * 1.4);
            }
            
            updateUI();
            save();
        }
    }

    // Авто-добыча (Idle)
    setInterval(() => {
        if (state.gps > 0) {
            state.money += state.gps / 10;
            updateUI();
        }
    }, 100);

    // Авто-сохранение раз в 30 сек
    setInterval(save, 30000);

    function save() {
        localStorage.setItem('idleMinerSave', JSON.stringify(state));
    }

    function resetGame() {
        if(confirm("Точно сбросить прогресс?")) {
            localStorage.clear();
            location.reload();
        }
    }

    function createParticle(text) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.innerText = text;
        p.style.left = (window.innerWidth / 2 + (Math.random()*40-20)) + 'px';
        p.style.top = (window.innerHeight / 2) + 'px';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1000);
    }

    updateUI();
</script>
</body>
</html>
