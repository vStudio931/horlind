<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>MINER TYCOON: ULTIMATE</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="exp-container">
        <div id="exp-bar"></div>
    </div>

    <div id="frenzy-container" class="hidden" onclick="startFrenzy()">
        🔥 ЛИХОРАДКА! 🔥
    </div>
    
    <div id="game-container">
        <div class="top-bar">
            <div class="stat">💰 <span id="money">0</span></div>
            <div class="stat">⚡ <span id="gps">0</span>/с</div>
            <div class="stat">⭐ Ур. <span id="lvl-text">1</span></div>
        </div>

        <div id="screen-mine" class="screen">
            <div class="mine-area">
                <div id="ore" onclick="handleMine(event)">💎</div>
            </div>
        </div>

        <div id="screen-shop" class="screen hidden">
            <div class="header-area">
                <h2>МАГАЗИН</h2>
            </div>
            <div id="shop-list" class="scrollable"></div>
        </div>

        <div id="screen-achievements" class="screen hidden">
            <div class="header-area">
                <h2>ДОСТИЖЕНИЯ</h2>
            </div>
            <div id="achievements-list" class="scrollable"></div>
        </div>

        <div id="screen-wheel" class="screen hidden">
            <div class="header-area">
                <h2>КОЛЕСО ФОРТУНЫ</h2>
            </div>
            <div class="wheel-box">
                <div id="wheel-visual">🎁</div>
                <button id="spin-btn" class="nav-btn" onclick="spinWheel()">КРУТИТЬ</button>
                <p id="wheel-timer">Доступно!</p>
            </div>
        </div>

        <nav class="bottom-menu">
            <button onclick="changeScreen('mine')" title="Добыча">⛏️</button>
            <button onclick="changeScreen('shop')" title="Магазин">🛒</button>
            <button onclick="changeScreen('achievements')" title="Достижения">🏆</button>
            <button onclick="changeScreen('wheel')" title="Удача">🎡</button>
        </nav>
    </div>

    <script src="data.js"></script>
    <script src="storage.js"></script>
    <script src="script.js"></script>
</body>
</html>
